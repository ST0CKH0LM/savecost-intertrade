<svg width="560" height="128" viewBox="0 0 560 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SaveCost horizontal logo</title>
  <desc id="desc">Original SaveCost logo artwork cropped and rearranged horizontally.</desc>
  <defs>
    <clipPath id="markClip">
      <rect x="0" y="0" width="112" height="112" rx="0"/>
    </clipPath>
    <clipPath id="wordClip">
      <rect x="0" y="0" width="410" height="92" rx="0"/>
    </clipPath>
  </defs>
  <rect width="560" height="128" fill="white" fill-opacity="0"/>
  <g transform="translate(8 8)" clip-path="url(#markClip)">
    <image href="/images/savecost-logo-original.jpg" x="-30" y="-1" width="169" height="166" preserveAspectRatio="xMidYMin slice"/>
  </g>
  <g transform="translate(138 21)" clip-path="url(#wordClip)">
    <image href="/images/savecost-logo-original.jpg" x="0" y="-295" width="410" height="404" preserveAspectRatio="xMidYMax slice"/>
  </g>
</svg>
